[experimento]
datasets = cora,citeseer,pubmed

victims = [{"model":"gat","hidden_size":128,"layers":2},{"model":"gcn","hidden_size":256,"layers":2}]

surrogates = [{"conv":"gcn","act":"relu"}]

seed = 451

batch_size = 32

embedding_layer_num = 2
embedding_hidden_size = 256
decoder_layer_num = 1

mask_std = 0.5
mask_ratio = 0.05

victim_epochs = 30
ssl_epochs = 30
surrogate_epochs = 100

query_limit = 10